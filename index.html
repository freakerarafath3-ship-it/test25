<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Netlify Test Page</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f3f4f6;
      color: #222;
    }
    main {
      max-width: 520px;
      margin: 24px;
      padding: 32px;
      text-align: center;
      background: white;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }
    h1 { color: #16835d; }
    button {
      padding: 10px 16px;
      border: 0;
      border-radius: 8px;
      background: #16835d;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <h1>Hello from Netlify!</h1>
    <p>This is a basic HTML page to test your GitHub-to-Netlify deployment.</p>
    <button onclick="document.getElementById('result').textContent='JavaScript is working!'">
      Test JavaScript
    </button>
    <p id="result" aria-live="polite"></p>
  </main>
</body>
</html>
